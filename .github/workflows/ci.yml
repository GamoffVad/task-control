# Проверки при каждом коммите и запросе на слияние: типы, линтер, тесты, сборка.
name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Типы
        run: npm run typecheck
      - name: Линтер
        run: npm run lint
      - name: Тесты
        run: npm test
      - name: Сборка
        run: npm run build
