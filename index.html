<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Тема до первой отрисовки, чтобы не мигал светлый фон. Основная — тёмная.
      try { document.documentElement.dataset.theme = localStorage.getItem('task-control:theme') === 'light' ? 'light' : 'dark'; } catch { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <meta name="description" content="Планирование задач отдела и контроль исполнения: календарь, недельный план, сроки, отчёты и показатели." />
    <title>Контроль задач</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
