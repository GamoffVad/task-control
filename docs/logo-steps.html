<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Логотип «Ступени»</title>
<style>
  /* Цвета знака — как в приложении «Контроль задач»: светлая тема и тёмная. */
  :root { --paper: #F7F5F0; --ink: #1F2B3A; --ink-3: #5D6575; --dash: #C9C6BD; --logo-dark: #1F2B3A; --logo-1: #1F3A5F; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #111826; --ink: #E7ECF3; --ink-3: #9AA6B8; --dash: #34405A; --logo-dark: #6094D3; --logo-1: #93B9F0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font: 14px/1.5 'Segoe UI', system-ui, sans-serif; padding: 24px 16px; }
  main { max-width: 760px; margin: 0 auto; display: grid; gap: 28px; }
  header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px dashed var(--dash); padding-bottom: 10px; }

  /* Логотип: область наведения неподвижна, кубики могут выходить за рамку SVG — overflow: visible. */
  .logo { display: inline-flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; border-radius: 4px; }
  .logo:focus-visible { outline: 2px solid var(--logo-1); outline-offset: 4px; }
  .logo svg { display: block; flex: none; overflow: visible; }
  .logo b { display: block; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
  .logo small { display: block; font-size: 11px; color: var(--ink-3); }
  .big { justify-self: center; padding: 40px; border: 1px dashed var(--dash); border-radius: 4px; }
  p { margin: 0; color: var(--ink-3); max-width: 64ch; }
  code { font-family: Consolas, monospace; font-size: 0.92em; }
</style>
</head>
<body>
<main>
  <header>
    <a class="logo" href="#" data-logo-steps aria-label="Контроль задач — на главную">
      <svg width="40" height="40" aria-hidden="true" focusable="false"></svg>
      <span><b>Контроль задач</b><small>планирование и контроль исполнения</small></span>
    </a>
  </header>

  <a class="logo big" href="#" data-logo-steps aria-label="Логотип крупно">
    <svg width="200" height="200" aria-hidden="true" focusable="false"></svg>
  </a>

  <p>Наведите курсор на знак логотипа. Кубики по очереди подпрыгивают — от нижней левой ступени к верхней правой — и возвращаются на место. Настройки — объект <code>STEPS</code> в начале сценария.</p>
</main>

<script>
/* ——— Настройки «Ступеней» ———
   Смещения — в единицах эталонного viewBox 0 0 56 52; при любом размере логотипа они масштабируются вместе с ним. */
const STEPS = {
  height: 8,      // высота прыжка вверх
  shift: 3,       // сдвиг влево в верхней точке
  landing: 1.5,   // проседание при приземлении
  delay: 50,      // задержка между кубиками, мс
  duration: 700,  // длительность прыжка одного кубика, мс
  easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
};

/* ——— Геометрия знака: клетки прямой сетки (буква «L»), повёрнутые на 45° ——— */
const CELLS = [ // [столбец, строка, тон]: 0 — тёмный, 1 — синий
  [2, 3, 1], [1, 3, 1], [0, 3, 0], [2, 2, 1], [1, 2, 0], [2, 1, 1], [1, 1, 0], [2, 0, 0], [1, 0, 1],
];
/* Порядок прыжков — явно, по ступеням диагонали снизу слева вверх вправо; внутри ступени первым прыгает левый. */
const JUMP_ORDER = [
  [0, 3], [1, 3], [2, 3], // ступень 1
  [1, 2], [2, 2],         // ступень 2
  [1, 1], [2, 1],         // ступень 3
  [1, 0], [2, 0],         // ступень 4
];
const STEP = 11, SIZE = 10.4, K = Math.SQRT1_2;
const rot = (x, y) => [(x - y) * K, (x + y) * K];
const corners = CELLS.flatMap(([cx, cy]) => {
  const x = cx * STEP, y = cy * STEP;
  return [rot(x, y), rot(x + SIZE, y), rot(x, y + SIZE), rot(x + SIZE, y + SIZE)];
});
const xs = corners.map((c) => c[0]), ys = corners.map((c) => c[1]);
const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
const side = Math.max(maxX - minX, maxY - minY) + 6;
const VIEW = `${((minX + maxX) / 2 - side / 2).toFixed(2)} ${((minY + maxY) / 2 - side / 2).toFixed(2)} ${side.toFixed(2)} ${side.toFixed(2)}`;
const UNIT = side / 56; // эталонные единицы → единицы нашего viewBox
const FILL = ['var(--logo-dark)', 'var(--logo-1)'];
const NS = 'http://www.w3.org/2000/svg';

/* Каждый кубик: внешняя группа ставит его на место, средняя (data-cube) анимируется,
   внутренний ромб держит свой поворот на 45° — анимация его не сбрасывает. */
function drawMark(svg) {
  svg.setAttribute('viewBox', VIEW);
  for (const [x, y, tone] of CELLS) {
    const [cx, cy] = rot(x * STEP + SIZE / 2, y * STEP + SIZE / 2);
    const place = document.createElementNS(NS, 'g');
    place.setAttribute('transform', `translate(${cx} ${cy})`);
    const cube = document.createElementNS(NS, 'g');
    cube.dataset.cube = `${x}-${y}`;
    const rect = document.createElementNS(NS, 'rect');
    Object.entries({ x: -SIZE / 2, y: -SIZE / 2, width: SIZE, height: SIZE, rx: 0.6, fill: FILL[tone], transform: 'rotate(45)' }).forEach(([k, v]) => rect.setAttribute(k, v));
    cube.append(rect);
    place.append(cube);
    svg.append(place);
  }
}

const frames = () => [
  { offset: 0, transform: 'translate(0px, 0px) scale(1, 1)', easing: STEPS.easing },
  { offset: 0.4, transform: `translate(${-STEPS.shift * UNIT}px, ${-STEPS.height * UNIT}px) scale(0.92, 0.92)`, easing: STEPS.easing },
  { offset: 0.72, transform: `translate(0px, ${STEPS.landing * UNIT}px) scale(1.08, 0.9)`, easing: STEPS.easing },
  { offset: 1, transform: 'translate(0px, 0px) scale(1, 1)' },
];
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

/* Один цикл: пока он идёт, повторные запуски игнорируются; уход курсора его не прерывает. */
function setup(link) {
  const svg = link.querySelector('svg');
  drawMark(svg);
  let running = false;
  const play = () => {
    if (running) return;
    running = true;
    const done = () => { running = false; };
    if (reducedMotion.matches) {
      svg.animate([{ opacity: 1 }, { opacity: 0.55 }, { opacity: 1 }], { duration: 420, easing: STEPS.easing }).finished.then(done, done);
      return;
    }
    const f = frames();
    const animations = JUMP_ORDER.map(([x, y], i) =>
      svg.querySelector(`[data-cube="${x}-${y}"]`).animate(f, { duration: STEPS.duration, delay: i * STEPS.delay, easing: 'linear', fill: 'none' }));
    animations.at(-1).finished.then(done, done);
  };
  // Только наведение курсора на сам знак (не на надпись рядом).
  svg.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') play(); });
  link.addEventListener('click', (e) => e.preventDefault());
}

document.querySelectorAll('[data-logo-steps]').forEach(setup);
</script>
</body>
</html>
